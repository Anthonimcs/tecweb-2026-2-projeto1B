{% extends "notes/base.html" %}
{% load static %}

{% block content %}

<header class="appbar">
  <img
    class="logo"
    src="{% static 'notes/img/logo-getit.png' %}"
    alt="Get-it"
  />

  <p class="subtitle">
    Como o Post-it, mas com outro verbo
  </p>
</header>


<main class="main-content">

  <form
    method="post"
    class="form-card"
  >
    {% csrf_token %}

    <input
      class="form-card-title"
      type="text"
      value="{{ note.title }}"
      name="titulo"
      placeholder="Título"
    />

    <textarea
      class="autoresize"
      name="detalhes"
      placeholder="Digite o conteúdo..."
    >{{ note.content }}</textarea>


    <div class="tag-input-group">

      <input
        class="form-card-tag"
        type="text"
        value="{{ tags_text }}"
        name="tags"
        placeholder="Tags"
        aria-describedby="tags-help"
      />

      <p
        class="tag-input-help"
        id="tags-help"
      >
        Separe várias tags por vírgula. Ex.: django, faculdade, projeto
      </p>

    </div>


    {% if error %}
      <p class="form-error">
        {{ error }}
      </p>
    {% endif %}


    <div class="update-buttons">

      <a
        class="btn-cancelar"
        href="{% url 'index' %}"
      >
        Cancelar
      </a>

      <button
        class="btn-salvar"
        type="submit"
      >
        Salvar
      </button>

    </div>

  </form>

</main>

{% endblock %}
